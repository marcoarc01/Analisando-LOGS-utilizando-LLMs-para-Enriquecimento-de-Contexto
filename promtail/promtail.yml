server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-logs
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            app_service: service
      - template:
          source: app_service
          template: '{{ if or (eq .Value "application-api") (eq .Value "stresser-app") }}{{ .Value }}{{ end }}'
      - labels:
          service: app_service
      # Only application logs reach Loki; lines without service (infra, non-JSON) are dropped.
      - match:
          selector: '{job="docker", service!~"application-api|stresser-app"}'
          action: drop
          drop_counter_reason: non_application_log
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log
