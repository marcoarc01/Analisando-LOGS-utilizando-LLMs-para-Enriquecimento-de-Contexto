services:
  application-api:
    image: application-api:1.0.0
    build: ./application-api
    # Dataset v2: falha de CPU real, sem a politica sintetica (o v1 e o commit 4b45cde e as imagens *-v1-backup).
    # Recalibrado em 2026-11-01 com os logs intermediarios, o jitter do k6, stress 0 e Toxiproxy transparente
    # (registros em C:\tcc-data\pilot\v2-calibration\calibration\).
    environment:
      - STRESSER_BASE_URL=${STRESSER_BASE_URL:-http://toxiproxy:8666}
      # Timeout = p99,9 da consulta ao Go vista pelo httpx (AWS Builders' Library, "Timeouts, retries and
      # backoff with jitter": 0,1% de timeouts falsos): 291,256 ms em 12.150 chamadas (25 min, medidas com
      # timeout de 2 s para nao truncar a cauda; IC 95% 282,8-309,7 ms), arredondado para cima.
      - STRESSER_TIMEOUT_SECONDS=${STRESSER_TIMEOUT_SECONDS:-0.292}
      - EXPERIMENT_SEED=${EXPERIMENT_SEED:-42}
      - MAX_EXPERIMENT_DELAY_MS=${MAX_EXPERIMENT_DELAY_MS:-2000}
      - DEGRADATION_POLICY=off
      # 50% de 1 CPU com a carga normal do k6 (meta do exemplo oficial do HPA do Kubernetes): 50,35% em 180 s.
      - REQUEST_WORK_ITERATIONS=${REQUEST_WORK_ITERATIONS:-218000}
    # Cota de 1 CPU, como limits.cpu do Kubernetes; sem cpuset; 1 processo do uvicorn por container.
    deploy:
      resources:
        limits:
          cpus: "1.0"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - toxiproxy

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "127.0.0.1:8474:8474"
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    restart: unless-stopped
    depends_on:
      - stresser-app
    # Driver local: logs fora de /var/lib/docker/containers/*/*.log, fora do Promtail.
    logging:
      driver: local

  stresser-app:
    image: stresser-observability:1.0.0
    build: ./stresser-app
    ports:
      - "8080:8080"
    environment:
      - STRESSER_PORT=8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=stresser-app
      # Estresse real: uma goroutine por P, ocupada level% de cada ciclo de 100 ms.
      - STRESS_MODE=duty
      # GOMAXPROCS igual a cota de CPU (o runtime do Go faz isso sozinho a partir do 1.25).
      - GOMAXPROCS=1
      # 50% de 1 CPU com a carga normal do k6 (meta do exemplo oficial do HPA do Kubernetes).
      - STATE_WORK_ITERATIONS=${STATE_WORK_ITERATIONS:-931000}
    restart: unless-stopped
    # Cota de 1 CPU, como limits.cpu do Kubernetes; sem cpuset.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    depends_on:
      - otel-collector

  prometheus:
    image: prom/prometheus:v3.11.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped
    depends_on:
      - stresser-app

  grafana:
    image: grafana/grafana:12.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?Defina GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus



  loki:
    image: grafana/loki:2.9.3
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.3
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml
      - promtail-positions:/var/lib/promtail
    command: -config.file=/etc/promtail/promtail.yml
    restart: unless-stopped
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.3.1
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo.yml
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo.yml
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    command: --config=/etc/otel-collector-config.yml
    restart: unless-stopped
    depends_on:
      - tempo

  k6:
    image: grafana/k6:1.8.1
    profiles: [loadtest]
    restart: "no"
    environment:
      K6_BASE_URL: ${K6_BASE_URL:-http://application-api:8000}
      K6_TEST_DURATION: ${K6_TEST_DURATION:-30s}
      K6_EXPERIMENT_RUN_ID: ${K6_EXPERIMENT_RUN_ID:-}
      K6_SCENARIO: ${K6_SCENARIO:-baseline}
      # Jitter seed (required by baseline.js): the orchestrator derives one per run.
      K6_SEED: ${K6_SEED:-}
      K6_MAX_EXPERIMENT_DELAY_MS: ${MAX_EXPERIMENT_DELAY_MS:-2000}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: avg,p(50),p(95),p(99),max
      K6_NO_USAGE_REPORT: "true"
    volumes:
      - ./load-tests:/scripts:ro
    command: [run, --quiet, --out, experimental-prometheus-rw, /scripts/baseline.js]
    logging:
      driver: "none"

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
    name: loki-data
  promtail-positions:
    name: promtail-positions
  tempo-data:
    name: tempo-data
